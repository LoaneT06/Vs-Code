<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MovieClub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Bienvenue sur MovieClub !</h1>
    <nav>
      <a href="#affiche">À l'affiche</a>
      <a href="#fenetre-contact">Contact</a>
    </nav>
  </header>

  <main>
    <section id="affiche">
      <h2>À l'affiche</h2>
      <p>Découvrez les films du moment !</p>

      <div class="affiches">
        <figure>
          <img src="images/hunger-games.jpg" alt="Affiche de Hunger Games : Lever de soleil sur la moisson">
          <figcaption>Hunger Games : Lever de soleil sur la moisson</figcaption>
          <p class="resume">
            Des années avant Katniss, le jeune Haymitch Abernathy est tiré au sort
            pour participer à une édition spéciale des Hunger Games, plus cruelle que jamais.
          </p>
        </figure>

        <figure>
          <img src="images/beau-pere.jpg" alt="Affiche de Mon beau-père, ma belle-fille et moi">
          <figcaption>Mon beau-père, ma belle-fille et moi</figcaption>
          <p class="resume">
            La famille Focker est de retour : Henry s'apprête à se marier, et les rencontres
            entre belles-familles tournent une nouvelle fois à la comédie.
          </p>
        </figure>

        <figure>
          <img src="images/billie.jpg" alt="Affiche de Billie, à la croisée des mondes">
          <figcaption>Billie, à la croisée des mondes</figcaption>
          <p class="resume">
            Le film d'animation de Noël de Disney, une aventure féerique
            qui met la magie à l'honneur.
          </p>
        </figure>
      </div>
    </section>

    <section id="contact">
      <h2>Contact</h2>
      <p>Vous pouvez m'écrire à : <a href="mailto:loane.turrou@alumni.univ-avignon.fr">loane.turrou@alumni.univ-avignon.fr</a></p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 - Ma première page web</p>
  </footer>

  <!-- Fenêtre de contact -->
  <div id="fenetre-contact" class="fenetre">
    <div class="fenetre-contenu">
      <a href="#" class="fermer" aria-label="Fermer">&times;</a>
      <h2>Contactez-moi</h2>
      <p>Envoyez-moi un message à l'adresse suivante :</p>
      <p>
        <a href="mailto:loane.turrou@alumni.univ-avignon.fr">loane.turrou@alumni.univ-avignon.fr</a>
      </p>
    </div>
  </div>

</body>
</html>
